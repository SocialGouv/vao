name: 🧪 E2E Tests

on:
  deployment_status:

env:
  BRANCH_NAME: ${{ github.event.deployment.ref || github.event.pull_request.head.ref || github.ref_name }}
  TZ: Europe/Paris
jobs:
  e2e:
    if: ${{ github.event.deployment_status.state == 'success' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        name: Install pnpm
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Env
        id: env
        uses: socialgouv/kontinuous/.github/actions/env@v1
      - name: Set env
        run: |
          echo "SITE_URL=${{ steps.env.outputs.subdomain }}.ovh.fabrique.social.gouv.fr" >> $GITHUB_ENV
      # Tous les identifiants réels vivent ici et nulle part ailleurs : ni au
      # niveau du workflow, ni dans le step des review apps, ni dans
      # `pnpm install`. C'est aussi leur présence qui coupe la rétention des
      # traces et vidéos (playwright.config.ts).
      - name: Run Playwright tests (main or preprod)
        if: ${{ env.BRANCH_NAME == 'main' || env.BRANCH_NAME == 'preprod' }}
        env:
          E2E_BO_PASSWORD: ${{ secrets.E2E_BO_PASSWORD }}
          E2E_MAILDEV_USERNAME: ${{ secrets.E2E_MAILDEV_USERNAME }}
          E2E_MAILDEV_PASSWORD: ${{ secrets.E2E_MAILDEV_PASSWORD }}
        run: |
          E2E_BASE_URL=${{ env.SITE_URL }} pnpm playwright test

      # Aucun secret dans l'environnement de ce step : les comptes de test
      # retombent sur leur mot de passe seedé, et les artefacts complets peuvent
      # être publiés.
      - name: Run Playwright tests (PR)
        if: ${{ env.BRANCH_NAME != 'main' && env.BRANCH_NAME != 'preprod' }}
        run: |
          E2E_BASE_URL=${{ env.SITE_URL }} pnpm playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
