# ============================================================================
# vao — CI + CD sur GitLab PIC (migration Atlas v2, phase preprod).
# Source de vérité du code : GitHub SocialGouv/vao (resync manuel vers ce dépôt).
#   build   : 7 images (monorepo pnpm) via DinD ci-common, en parallel:matrix
# Déploiement : Atlas v2 (zone dev) via ArgoCD synchronisant vao-gitops (branche rendered).
#
# Frontends Nuxt statiques, principe "build-once" : le Dockerfile écrit des marqueurs
#   `__NUXT_PUBLIC_X__` à la place des valeurs propres à un environnement ; ils sont remplacés
#   au démarrage du conteneur par les variables posées par le chart (docker/runtime-env.sh),
#   ce qui permet à une même image de servir tous les environnements.
# Aucune variable CI/CD secrète requise côté app (DinD + trigger par CI_JOB_TOKEN).
# ============================================================================

include:
  - project: socialgouv/commun/studio-tech-commun/sdpsn-devops-ci-utils
    ref: main
    file: ci-common/image-build.yml
  - component: $CI_SERVER_FQDN/socialgouv/produits-dnum/studio-tech/devops/components/gitops-cd-component/trigger_app@0.2.0
    inputs:
      job_name: deploy-preprod
      stage: deploy
      gitops_project: socialgouv/produits-dnum/citoyens/vao/vao-gitops
      deploy_action: preprod
      image_tag: "sha-$CI_COMMIT_SHA"
      rules:
        - if: $CI_COMMIT_BRANCH == "feat/ci-atlas-v2"
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - build
  - deploy
  - e2e

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_BRANCH

.build-rules: &build-rules
  - if: $CI_COMMIT_BRANCH =~ /^(feat|fix|chore|migration)\//
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

check:
  stage: check
  image: node:22.20.0
  interruptible: true
  tags:
    - socialgouv-linux-small-amd64
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    NO_PROXY: docker
    no_proxy: docker
    TESTCONTAINERS_RYUK_DISABLED: "true"
  cache:
    key: pnpm-store
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - sleep 3
  script:
    - pnpm -w lint:all
    - pnpm -w test:unit:all
    - pnpm --filter @vao/frontend-bo typecheck
    - pnpm --filter @vao/frontend-usagers typecheck
    - pnpm -w test:unit:frontend

# ---------------------------------------------------------------------------
# BUILD : 7 images (contexte = racine du monorepo, Dockerfile par package).
# Backends/jobs sans build-arg ; frontends avec NUXT_PUBLIC_* (Sentry/Matomo off phase 1).
# ---------------------------------------------------------------------------
build:
  extends: .build-dind
  interruptible: true
  parallel:
    matrix:
      - COMPONENT: [backend, external-api, cron, migrations, init-db]
  variables:
    BUILD_IMAGE: "$CI_REGISTRY_IMAGE/$COMPONENT"
    BUILD_DOCKERFILE: "packages/$COMPONENT/Dockerfile"
    BUILD_TAGS: "sha-$CI_COMMIT_SHA"
  rules: *build-rules

build-frontends:
  extends: .build-dind
  interruptible: true
  parallel:
    matrix:
      - COMPONENT: [frontend-usagers, frontend-bo]
  variables:
    BUILD_IMAGE: "$CI_REGISTRY_IMAGE/$COMPONENT"
    BUILD_DOCKERFILE: "packages/$COMPONENT/Dockerfile"
    BUILD_TAGS: "sha-$CI_COMMIT_SHA"
    # Les valeurs qui dépendent de l'environnement (URL du backend, nom d'environnement,
    # Matomo, Sentry) ne sont volontairement PAS passées ici : le Dockerfile écrit des
    # marqueurs à leur place, remplacés au démarrage du conteneur par les variables du
    # déploiement. Les repasser en --build-arg les figerait dans l'image et annulerait ce
    # mécanisme. Ne restent donc ici que les valeurs identiques pour tous les environnements.
    # NUXT_PUBLIC_API_MAP_TILER : clé publique front (déjà en clair dans le workflow GitHub).
    BUILD_ARGS: |
      NUXT_PUBLIC_APP_VERSION=sha-$CI_COMMIT_SHORT_SHA
      NUXT_PUBLIC_API_MAP_TILER=g9IvoA8h0Ow8I9szhdzW
  rules: *build-rules

deploy-preprod:
  needs: ["build", "build-frontends"]
  environment:
    name: preprod

e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.50.1-noble
  needs: ["deploy-preprod"]
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "feat/ci-atlas-v2"
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  variables:
    E2E_BASE_URL: "vao-preprod.env-01ktvpxqrkny0sxv6qysgj95rt.dev.atlas-prod.public-cloud.social.gouv.fr"
  cache:
    key: pnpm-store
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm playwright test
  artifacts:
    when: always
    paths:
      - playwright-report/
    expire_in: 1 week