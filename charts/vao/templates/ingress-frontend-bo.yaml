{{- if and .Values.frontendBo.enabled .Values.frontendBo.ingress.enabled }}
{{- $host := .Values.frontendBo.host | default (printf "bo-%s" (.Values.global.host | required "global.host must be set")) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-bo
  labels:
    {{- include "vao.componentLabels" (dict "context" . "component" "frontend-bo") | nindent 4 }}
  annotations:
    {{- with .Values.global.certManagerClusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . }}
    {{- end }}
    {{- include "vao.annotations" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.global.ingressClassName }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - backend:
              service:
                name: frontend-bo
                port:
                  name: http
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - {{ $host }}
      secretName: {{ .Values.global.tlsSecretName | default "frontend-bo-tls" }}
{{- end }}
