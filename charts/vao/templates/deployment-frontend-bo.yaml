{{- if .Values.frontendBo.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-bo
  labels:
    {{- include "vao.componentLabels" (dict "context" . "component" "frontend-bo") | nindent 4 }}
  annotations:
    {{- include "vao.annotations" . | nindent 4 }}
spec:
  {{- if not .Values.frontendBo.autoscaling.enabled }}
  replicas: {{ .Values.frontendBo.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vao.selectorLabels" (dict "context" . "component" "frontend-bo") | nindent 6 }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "vao.componentLabels" (dict "context" . "component" "frontend-bo") | nindent 8 }}
      annotations:
        {{- include "vao.annotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "vao.serviceAccountName" . }}
      {{- include "vao.imagePullSecrets" . | nindent 6 }}
      {{- include "vao.podAntiAffinity" (dict "context" . "component" "frontend-bo") | nindent 6 }}
      containers:
        - name: app
          image: {{ include "vao.image" (dict "context" . "package" .Values.frontendBo.image.package) }}
          {{- with .Values.global.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.frontendBo.containerPort }}
              name: http
          {{- with .Values.frontendBo.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.frontendBo.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.frontendBo.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.frontendBo.resources | nindent 12 }}
          env:
            # Build-once : l'image porte des sentinelles __NUXT_PUBLIC_X__, substituées au
            # démarrage par docker/runtime-env.sh. Sans effet sur une image aux valeurs
            # déjà cuites (--build-arg) : aucune sentinelle à remplacer.
            {{- range $key, $value := .Values.frontendBo.env }}
            - name: {{ $key }}
              value: {{ tpl $value $ | quote }}
            {{- end }}
          lifecycle:
            postStart:
              exec:
                command: ["sh", "-c", "touch /var/run/readiness-check/readiness-file"]
            preStop:
              exec:
                command: ["sh", "-c", "rm -f /var/run/readiness-check/readiness-file; sleep 30"]
          volumeMounts:
            - name: readiness-check-volume
              mountPath: /var/run/readiness-check
      volumes:
        - name: readiness-check-volume
          emptyDir: {}
{{- end }}
