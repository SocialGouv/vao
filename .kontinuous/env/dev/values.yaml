global:
  s3SecretName: vao-dev-app-access-key

maildev:
  ingress:
    # Traefik traduit ces annotations nginx en middleware BasicAuth, mais si le
    # secret est absent il se contente de logger l'erreur et sert le trafic sans
    # middleware. Le SealedSecret maildev-basic-auth est donc déployé
    # inconditionnellement dans cet env, y compris là où l'annotation ne
    # s'applique pas : c'est ce qui empêche le contrôle d'échouer en silence.
    # Le rendu doit tenir sur une ligne : kontinuous passe la sortie d'un ~tpl~
    # à loadValue, qui enveloppe toute valeur multi-ligne dans un scalaire bloc
    # et rend donc une chaîne, que le schéma du chart rejette. D'où le flow JSON,
    # comme le ~tpl~annotations de pgweb.
    ~tpl~annotations: '{{ if eq .Values.global.gitBranch "main" }}{"nginx.ingress.kubernetes.io/auth-type": "basic", "nginx.ingress.kubernetes.io/auth-secret": "maildev-basic-auth", "nginx.ingress.kubernetes.io/auth-realm": "Maildev VAO"}{{ else }}{}{{ end }}'

backend:
  vars:
    S3_BUCKET_ROOT_DIR: review-branch/{{ .Values.global.branchSlug32  }}/files

external-api:
  vars:
    S3_BUCKET_ROOT_DIR: review-branch/{{ .Values.global.branchSlug32  }}/files

migrate-s3:
  vars:
    S3_BUCKET_ROOT_DIR: review-branch/{{ .Values.global.branchSlug32  }}/files

jobs:
  runs:
    migrations-db:
      env:
        - name: PG_VAO_SUPERUSER
          valueFrom:
            secretKeyRef:
              name: pg-superuser
              key: user
        - name: PG_VAO_SUPERPASSWORD
          valueFrom:
            secretKeyRef:
              name: pg-superuser
              key: password
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: pg-superuser
              key: host
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: pg-superuser
              key: port
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: pg-app
              key: PGDATABASE
        - name: S3_BUCKET_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: "{{.Values.global.s3SecretName}}"
              key: bucket_endpoint
        - name: S3_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: "{{.Values.global.s3SecretName}}"
              key: bucket_name
        - name: S3_BUCKET_REGION
          valueFrom:
            secretKeyRef:
              name: "{{.Values.global.s3SecretName}}"
              key: bucket_region
        - name: S3_BUCKET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: "{{.Values.global.s3SecretName}}"
              key: bucket_access_key
        - name: S3_BUCKET_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: "{{.Values.global.s3SecretName}}"
              key: bucket_secret_key
        - name: S3_BUCKET_ROOT_DIR
          value: review-branch/{{ .Values.global.branchSlug32  }}/files
        - name: SEEDS_DIR
          value: "e2e"
